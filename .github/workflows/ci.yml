name: CI

on:
  pull_request:
  push:
    branches: [main, feat/proyectos-propios]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web links
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/proyectos-propios')
    runs-on: [self-hosted, homelab]
    concurrency:
      group: gubia-homelab
      cancel-in-progress: false
    steps:
      - name: Desplegar en el homelab
        run: |
          cd "$HOME/apps/gubia-digital"
          GUBIA_DEPLOY_OK=1 GUBIA_BRANCH="${{ github.ref_name }}" infra/deploy.sh
