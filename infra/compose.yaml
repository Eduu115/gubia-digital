# Fase 0 stub — ampliar en fase 5
services:
  gubia-web:
    build:
      context: ../web
    ports:
      - "8080:80"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
  gubia-contact:
    build:
      context: ../contact-api
    mem_limit: 128m
    environment:
      PORT: "8787"
      DB_PATH: /data/leads.sqlite
    volumes:
      - gubia-leads:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  gubia-leads:
